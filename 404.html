<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<title>FFKIPAS</title>
<script>
  // GitHub Pages SPA fallback: arahkan path section ke index.html
  // Client script.js akan baca pathname dan scroll ke section
  sessionStorage.setItem("spa_redirect", location.pathname + location.search + location.hash);
  location.replace("/index.html" + location.search + location.hash);
</script>
</head>
<body></body>
</html>
